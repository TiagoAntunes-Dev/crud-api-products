<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ProdutosHub — Gerenciador de Produtos</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400&family=Syne:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:       #0a0a0f;
      --surface:  #111118;
      --border:   #1e1e2e;
      --accent:   #00e5a0;
      --accent2:  #ff4d6d;
      --text:     #e8e8f0;
      --muted:    #5a5a7a;
      --card-bg:  #13131c;
      --input-bg: #0d0d14;
      --success:  #00e5a0;
      --error:    #ff4d6d;
      --warning:  #ffd166;
      --radius:   4px;
      --font-mono: 'Space Mono', monospace;
      --font-sans: 'Syne', sans-serif;
    }

    html { scroll-behavior: smooth; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-sans);
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* ── GRID BACKGROUND ── */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(0,229,160,.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,229,160,.03) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
      z-index: 0;
    }

    /* ── HEADER ── */
    header {
      position: relative;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1.5rem 2.5rem;
      border-bottom: 1px solid var(--border);
      background: rgba(10,10,15,.9);
      backdrop-filter: blur(12px);
    }

    .logo {
      font-family: var(--font-sans);
      font-weight: 800;
      font-size: 1.4rem;
      letter-spacing: -.02em;
      display: flex;
      align-items: center;
      gap: .5rem;
    }

    .logo span { color: var(--accent); }
    .logo-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); animation: pulse 2s infinite; }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: .5; transform: scale(1.4); }
    }

    .api-badge {
      font-family: var(--font-mono);
      font-size: .7rem;
      padding: .3rem .7rem;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--muted);
      display: flex;
      align-items: center;
      gap: .4rem;
    }

    .api-badge .dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--muted);
      transition: background .3s;
    }

    .api-badge.connected .dot { background: var(--accent); box-shadow: 0 0 6px var(--accent); }

    /* ── MAIN LAYOUT ── */
    main {
      position: relative;
      z-index: 1;
      max-width: 1200px;
      margin: 0 auto;
      padding: 2.5rem 2rem;
      display: grid;
      grid-template-columns: 380px 1fr;
      gap: 2rem;
      align-items: start;
    }

    @media (max-width: 900px) {
      main { grid-template-columns: 1fr; }
      header { padding: 1rem 1.2rem; }
    }

    /* ── SECTION TITLES ── */
    .section-title {
      font-family: var(--font-mono);
      font-size: .65rem;
      text-transform: uppercase;
      letter-spacing: .15em;
      color: var(--muted);
      margin-bottom: 1rem;
      display: flex;
      align-items: center;
      gap: .5rem;
    }

    .section-title::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    /* ── FORM CARD ── */
    .form-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.5rem;
      position: sticky;
      top: 2rem;
    }

    .form-card h2 {
      font-size: 1.1rem;
      font-weight: 600;
      margin-bottom: 1.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .mode-badge {
      font-family: var(--font-mono);
      font-size: .65rem;
      padding: .2rem .5rem;
      border-radius: var(--radius);
      background: rgba(0,229,160,.1);
      color: var(--accent);
      border: 1px solid rgba(0,229,160,.2);
    }

    .mode-badge.edit-mode {
      background: rgba(255,77,109,.1);
      color: var(--accent2);
      border-color: rgba(255,77,109,.2);
    }

    .field {
      margin-bottom: 1rem;
    }

    label {
      display: block;
      font-family: var(--font-mono);
      font-size: .7rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: .08em;
      margin-bottom: .4rem;
    }

    input {
      width: 100%;
      background: var(--input-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: .65rem .85rem;
      font-family: var(--font-mono);
      font-size: .85rem;
      color: var(--text);
      outline: none;
      transition: border-color .2s, box-shadow .2s;
    }

    input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 2px rgba(0,229,160,.1);
    }

    input::placeholder { color: var(--muted); }

    .btn {
      width: 100%;
      padding: .75rem 1rem;
      border: none;
      border-radius: var(--radius);
      font-family: var(--font-sans);
      font-size: .9rem;
      font-weight: 600;
      cursor: pointer;
      transition: all .2s;
      letter-spacing: .02em;
      margin-bottom: .5rem;
    }

    .btn-primary {
      background: var(--accent);
      color: #000;
    }

    .btn-primary:hover { filter: brightness(1.1); transform: translateY(-1px); }

    .btn-secondary {
      background: transparent;
      color: var(--muted);
      border: 1px solid var(--border);
      font-size: .8rem;
    }

    .btn-secondary:hover { border-color: var(--muted); color: var(--text); }

    /* ── TOAST ── */
    #toast {
      position: fixed;
      bottom: 2rem;
      right: 2rem;
      z-index: 999;
      display: flex;
      flex-direction: column;
      gap: .5rem;
    }

    .toast-item {
      font-family: var(--font-mono);
      font-size: .8rem;
      padding: .75rem 1.1rem;
      border-radius: var(--radius);
      border: 1px solid;
      display: flex;
      align-items: center;
      gap: .6rem;
      animation: slideIn .3s ease;
      max-width: 320px;
    }

    @keyframes slideIn {
      from { transform: translateX(110%); opacity: 0; }
      to   { transform: translateX(0); opacity: 1; }
    }

    .toast-item.success {
      background: rgba(0,229,160,.08);
      border-color: rgba(0,229,160,.25);
      color: var(--success);
    }

    .toast-item.error {
      background: rgba(255,77,109,.08);
      border-color: rgba(255,77,109,.25);
      color: var(--error);
    }

    /* ── PRODUCTS PANEL ── */
    .products-panel {}

    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1rem;
      gap: 1rem;
    }

    .count-badge {
      font-family: var(--font-mono);
      font-size: .75rem;
      color: var(--muted);
    }

    .count-badge strong { color: var(--accent); }

    .btn-refresh {
      background: transparent;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: .4rem .8rem;
      font-family: var(--font-mono);
      font-size: .7rem;
      color: var(--muted);
      cursor: pointer;
      transition: all .2s;
      display: flex;
      align-items: center;
      gap: .4rem;
    }

    .btn-refresh:hover { border-color: var(--accent); color: var(--accent); }

    /* ── PRODUCT TABLE ── */
    .table-wrap {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    thead {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
    }

    th {
      font-family: var(--font-mono);
      font-size: .65rem;
      text-transform: uppercase;
      letter-spacing: .1em;
      color: var(--muted);
      padding: .75rem 1rem;
      text-align: left;
      white-space: nowrap;
    }

    tbody tr {
      border-bottom: 1px solid var(--border);
      transition: background .15s;
    }

    tbody tr:last-child { border-bottom: none; }
    tbody tr:hover { background: rgba(255,255,255,.02); }

    td {
      padding: .85rem 1rem;
      font-size: .85rem;
      vertical-align: middle;
    }

    .td-name {
      font-weight: 600;
      max-width: 180px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .td-price {
      font-family: var(--font-mono);
      color: var(--accent);
    }

    .td-qty {
      font-family: var(--font-mono);
      color: var(--muted);
    }

    .td-img img {
      width: 36px;
      height: 36px;
      object-fit: cover;
      border-radius: var(--radius);
      border: 1px solid var(--border);
    }

    .td-img .no-img {
      width: 36px; height: 36px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: .7rem;
      color: var(--muted);
    }

    .td-actions {
      display: flex;
      gap: .4rem;
    }

    .btn-action {
      padding: .3rem .65rem;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: transparent;
      font-family: var(--font-mono);
      font-size: .65rem;
      cursor: pointer;
      transition: all .15s;
      white-space: nowrap;
    }

    .btn-edit {
      color: var(--warning);
      border-color: rgba(255,209,102,.2);
    }

    .btn-edit:hover {
      background: rgba(255,209,102,.1);
      border-color: var(--warning);
    }

    .btn-delete {
      color: var(--error);
      border-color: rgba(255,77,109,.2);
    }

    .btn-delete:hover {
      background: rgba(255,77,109,.1);
      border-color: var(--error);
    }

    /* ── EMPTY & LOADING STATES ── */
    .state-row td {
      text-align: center;
      padding: 3rem;
      color: var(--muted);
      font-family: var(--font-mono);
      font-size: .8rem;
    }

    .spinner {
      display: inline-block;
      width: 16px; height: 16px;
      border: 2px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin .6s linear infinite;
      vertical-align: middle;
      margin-right: .4rem;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── ID DISPLAY ── */
    .td-id {
      font-family: var(--font-mono);
      font-size: .65rem;
      color: var(--muted);
      max-width: 80px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* ── CONFIG MODAL ── */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.7);
      backdrop-filter: blur(4px);
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity .2s;
    }

    .modal-backdrop.open {
      opacity: 1;
      pointer-events: all;
    }

    .modal {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 2rem;
      width: 90%;
      max-width: 480px;
      transform: translateY(20px);
      transition: transform .2s;
    }

    .modal-backdrop.open .modal { transform: translateY(0); }

    .modal h3 {
      font-size: 1rem;
      margin-bottom: 1.2rem;
      display: flex;
      align-items: center;
      gap: .5rem;
    }

    .modal-actions {
      display: flex;
      gap: .5rem;
      margin-top: 1rem;
    }

    .modal-actions .btn { margin-bottom: 0; }

    .btn-confirm {
      flex: 1;
      background: var(--accent);
      color: #000;
    }

    .btn-cancel {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--muted);
    }
  </style>
</head>
<body>

  <!-- ── HEADER ── -->
  <header>
    <div class="logo">
      <div class="logo-dot"></div>
      Produtos<span>Hub</span>
    </div>
    <div class="api-badge" id="apiBadge">
      <div class="dot"></div>
      <span id="apiUrl">configurando...</span>
    </div>
  </header>

  <!-- ── MAIN ── -->
  <main>

    <!-- ── FORM SIDEBAR ── -->
    <aside>
      <p class="section-title">Operação</p>
      <div class="form-card">
        <h2>
          <span id="formTitle">Novo Produto</span>
          <span class="mode-badge" id="modeBadge">CREATE</span>
        </h2>

        <input type="hidden" id="editId" />

        <div class="field">
          <label for="name">Nome *</label>
          <input type="text" id="name" placeholder="Ex: Tênis Air Max" />
        </div>
        <div class="field">
          <label for="price">Preço (R$) *</label>
          <input type="number" id="price" placeholder="0.00" min="0" step="0.01" />
        </div>
        <div class="field">
          <label for="quantity">Quantidade em Estoque</label>
          <input type="number" id="quantity" placeholder="0" min="0" />
        </div>
        <div class="field">
          <label for="image">URL da Imagem</label>
          <input type="text" id="image" placeholder="https://..." />
        </div>

        <button class="btn btn-primary" onclick="handleSubmit()">
          <span id="btnLabel">➕ Criar Produto</span>
        </button>
        <button class="btn btn-secondary" id="cancelBtn" onclick="resetForm()" style="display:none">
          ✕ Cancelar Edição
        </button>
      </div>
    </aside>

    <!-- ── PRODUCTS LIST ── -->
    <section class="products-panel">
      <p class="section-title">Catálogo</p>
      <div class="toolbar">
        <span class="count-badge">Total: <strong id="totalCount">—</strong> produtos</span>
        <button class="btn-refresh" onclick="loadProducts()">
          ↻ Atualizar
        </button>
      </div>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>ID</th>
              <th>Imagem</th>
              <th>Nome</th>
              <th>Preço</th>
              <th>Qtd</th>
              <th>Ações</th>
            </tr>
          </thead>
          <tbody id="productTableBody">
            <tr class="state-row">
              <td colspan="6"><span class="spinner"></span> Carregando...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </section>
  </main>

  <!-- ── TOAST CONTAINER ── -->
  <div id="toast"></div>

  <!-- ── CONFIG MODAL (first visit) ── -->
  <div class="modal-backdrop" id="configModal">
    <div class="modal">
      <h3>⚙️ Configurar API</h3>
      <p style="font-size:.85rem; color:var(--muted); margin-bottom:1.2rem; line-height:1.6">
        Informe a URL base da sua API hospedada (ex: Render, Railway, etc).
        Não use <code style="color:var(--accent)">localhost</code> em produção.
      </p>
      <div class="field">
        <label>URL da API (produção)</label>
        <input type="text" id="modalApiUrl" placeholder="https://minha-api.onrender.com" />
      </div>
      <div class="modal-actions">
        <button class="btn btn-confirm" onclick="saveApiUrl()">Salvar e Conectar</button>
      </div>
    </div>
  </div>

<script>
  /* ─────────────────────────────────────────────
     CONFIGURAÇÃO DA API
     Edite a linha abaixo para apontar para sua API em produção.
     Exemplo: const DEFAULT_API = 'https://minha-api.onrender.com';
  ───────────────────────────────────────────── */
  const DEFAULT_API = '';   // ← COLOQUE A URL DA SUA API AQUI

  let API_BASE = localStorage.getItem('api_base') || DEFAULT_API;

  /* ── INIT ── */
  window.addEventListener('DOMContentLoaded', () => {
    if (!API_BASE) {
      document.getElementById('configModal').classList.add('open');
    } else {
      initApp();
    }
  });

  function saveApiUrl() {
    const val = document.getElementById('modalApiUrl').value.trim().replace(/\/$/, '');
    if (!val) { showToast('Informe uma URL válida.', 'error'); return; }
    localStorage.setItem('api_base', val);
    API_BASE = val;
    document.getElementById('configModal').classList.remove('open');
    initApp();
  }

  function initApp() {
    const urlEl = document.getElementById('apiUrl');
    const badge = document.getElementById('apiBadge');
    urlEl.textContent = API_BASE.replace('https://', '');
    badge.classList.add('connected');
    loadProducts();
  }

  const ENDPOINT = () => `${API_BASE}/api/products`;

  /* ── LOAD ALL ── */
  async function loadProducts() {
    const tbody = document.getElementById('productTableBody');
    tbody.innerHTML = `<tr class="state-row"><td colspan="6"><span class="spinner"></span> Carregando...</td></tr>`;

    try {
      const res = await fetch(ENDPOINT());
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const data = await res.json();

      document.getElementById('totalCount').textContent = data.length;

      if (!data.length) {
        tbody.innerHTML = `<tr class="state-row"><td colspan="6">Nenhum produto cadastrado ainda.</td></tr>`;
        return;
      }

      tbody.innerHTML = data.map(p => `
        <tr>
          <td class="td-id" title="${p._id}">${p._id.slice(-6)}</td>
          <td class="td-img">
            ${p.image
              ? `<img src="${p.image}" alt="${p.name}" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">`
              : ''
            }
            <div class="no-img" ${p.image ? 'style="display:none"' : ''}>IMG</div>
          </td>
          <td class="td-name" title="${p.name}">${p.name}</td>
          <td class="td-price">R$ ${Number(p.price).toFixed(2)}</td>
          <td class="td-qty">${p.quantity ?? 0}</td>
          <td>
            <div class="td-actions">
              <button class="btn-action btn-edit" onclick="editProduct('${p._id}', \`${escJs(p.name)}\`, ${p.price}, ${p.quantity ?? 0}, \`${escJs(p.image || '')}\`)">✎ Editar</button>
              <button class="btn-action btn-delete" onclick="deleteProduct('${p._id}', \`${escJs(p.name)}\`)">✕ Deletar</button>
            </div>
          </td>
        </tr>
      `).join('');
    } catch (e) {
      tbody.innerHTML = `<tr class="state-row"><td colspan="6" style="color:var(--error)">⚠ Erro ao carregar: ${e.message}</td></tr>`;
      showToast('Falha ao conectar com a API.', 'error');
    }
  }

  /* ── SUBMIT (CREATE / UPDATE) ── */
  async function handleSubmit() {
    const id       = document.getElementById('editId').value;
    const name     = document.getElementById('name').value.trim();
    const price    = parseFloat(document.getElementById('price').value);
    const quantity = parseInt(document.getElementById('quantity').value) || 0;
    const image    = document.getElementById('image').value.trim();

    if (!name) { showToast('O nome é obrigatório.', 'error'); return; }
    if (isNaN(price) || price < 0) { showToast('Informe um preço válido.', 'error'); return; }

    const body = JSON.stringify({ name, price, quantity, ...(image && { image }) });
    const isEdit = !!id;

    try {
      const res = await fetch(isEdit ? `${ENDPOINT()}/${id}` : ENDPOINT(), {
        method: isEdit ? 'PUT' : 'POST',
        headers: { 'Content-Type': 'application/json' },
        body
      });

      if (!res.ok) {
        const err = await res.json();
        throw new Error(err.message || `HTTP ${res.status}`);
      }

      showToast(isEdit ? 'Produto atualizado! ✓' : 'Produto criado! ✓', 'success');
      resetForm();
      loadProducts();
    } catch (e) {
      showToast(`Erro: ${e.message}`, 'error');
    }
  }

  /* ── EDIT ── */
  function editProduct(id, name, price, quantity, image) {
    document.getElementById('editId').value     = id;
    document.getElementById('name').value       = name;
    document.getElementById('price').value      = price;
    document.getElementById('quantity').value   = quantity;
    document.getElementById('image').value      = image;
    document.getElementById('formTitle').textContent = 'Editar Produto';
    document.getElementById('modeBadge').textContent = 'UPDATE';
    document.getElementById('modeBadge').classList.add('edit-mode');
    document.getElementById('btnLabel').textContent  = '✓ Salvar Alterações';
    document.getElementById('cancelBtn').style.display = 'block';
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  /* ── DELETE ── */
  async function deleteProduct(id, name) {
    if (!confirm(`Deletar "${name}"? Essa ação não pode ser desfeita.`)) return;
    try {
      const res = await fetch(`${ENDPOINT()}/${id}`, { method: 'DELETE' });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      showToast(`"${name}" deletado.`, 'success');
      loadProducts();
    } catch (e) {
      showToast(`Erro ao deletar: ${e.message}`, 'error');
    }
  }

  /* ── RESET FORM ── */
  function resetForm() {
    ['editId','name','price','quantity','image'].forEach(id => document.getElementById(id).value = '');
    document.getElementById('formTitle').textContent = 'Novo Produto';
    document.getElementById('modeBadge').textContent = 'CREATE';
    document.getElementById('modeBadge').classList.remove('edit-mode');
    document.getElementById('btnLabel').textContent  = '➕ Criar Produto';
    document.getElementById('cancelBtn').style.display = 'none';
  }

  /* ── TOAST ── */
  function showToast(msg, type = 'success') {
    const container = document.getElementById('toast');
    const el = document.createElement('div');
    el.className = `toast-item ${type}`;
    el.innerHTML = `<span>${type === 'success' ? '✓' : '⚠'}</span> ${msg}`;
    container.appendChild(el);
    setTimeout(() => el.remove(), 3500);
  }

  /* ── HELPER ── */
  function escJs(str) { return (str || '').replace(/`/g, '\\`').replace(/\$/g, '\\$'); }
</script>
